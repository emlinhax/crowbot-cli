[package]
name = "crowbot"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Terminal coding agent for crowbot.sh"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
futures-util = "0.3.34"
jiff = { version = "0.2.37", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "http2", "rustls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "signal"] }
toml = "1.1.6"

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["net", "process"] }

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
