[package]
name = "crowbot"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Terminal coding agent for crowbot.sh"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
fastrand = "2.5.0"
futures-util = "0.3.34"
globset = "0.4.20"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
htmd = "0.5.5"
ignore = "0.4.33"
jiff = { version = "0.2.37", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "http2", "rustls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.2.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "signal", "process"] }
tokio-util = "0.7.19"
toml = "1.1.6"

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["net", "process"] }

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[[test]]
name = "smoke"
path = "tests/smoke.rs"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"
