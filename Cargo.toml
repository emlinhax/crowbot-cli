# cffetch is the user's own crate, vendored unchanged so it can be re-synced from upstream. It is
# excluded rather than a member: cargo then treats it as an outside crate, so crowbot's rustfmt,
# clippy -D warnings and clippy.toml bans never touch it. Its own suite runs from its directory.
[workspace]
exclude = ["crates/cffetch"]

[package]
name = "crowbot"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
description = "Terminal coding agent for crowbot.sh"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
base64 = "0.23.1"
# webfetch only: browser TLS (wreq/BoringSSL), challenge detection. The API stays on reqwest.
cffetch = { path = "crates/cffetch" }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
fastrand = "2.5.0"
futures-util = "0.3.34"
globset = "0.4.20"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
htmd = "0.5.5"
ignore = "0.4.33"
jiff = { version = "0.2.37", features = ["serde"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
quick-xml = "0.37.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "http2", "rustls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.2.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "signal", "process"] }
tokio-util = "0.7.19"
toml = "1.1.6"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
url = "2.5.8"

[dev-dependencies]
axum = "0.8.9"
insta = "1.48.0"
portable-pty = "0.9.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["net", "process"] }
vt100 = "0.16.2"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[[test]]
name = "smoke"
path = "tests/smoke.rs"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Registry"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"
