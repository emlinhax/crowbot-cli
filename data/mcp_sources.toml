# Where other apps keep the MCP servers they use, so crowbot can offer the same ones without a
# word in its own config (src/mcp/discover). Each `[[source]]`:
# - `name`: as crowbot shows it.
# - `scope`: `user` for an app's own settings, `project` for a file a repository ships, asked
#   about apart and only for that project.
# - `paths`: every file to read. `{NAME}` is that environment variable and `{project}` the
#   project folder; a path naming an unset variable, or a file that is not there, is skipped,
#   so one list serves Windows, macOS and Linux.
# - `format`: `json`, `jsonc` (comments and trailing commas allowed) or `toml`.
# - `at`: the keys leading to the map of servers by name; `{project}` as above.
# - `shape`: how one server is written: `common` (`command`, `args`, `env`, or `url` and
#   `headers`, as most apps write it) or `opencode` (`command` as one list, `environment`).
# Sources earlier in this list win a name two different servers share.

[[source]]
name = "Claude Desktop"
scope = "user"
paths = [
  "{APPDATA}/Claude/claude_desktop_config.json",
  "{HOME}/Library/Application Support/Claude/claude_desktop_config.json",
  "{XDG_CONFIG_HOME}/Claude/claude_desktop_config.json",
  "{HOME}/.config/Claude/claude_desktop_config.json",
]
format = "json"
at = ["mcpServers"]
shape = "common"

[[source]]
name = "Claude Code"
scope = "user"
paths = ["{HOME}/.claude.json", "{USERPROFILE}/.claude.json"]
format = "json"
at = ["mcpServers"]
shape = "common"

# Claude Code's servers for this project alone, kept in the user's own file.
[[source]]
name = "Claude Code"
scope = "user"
paths = ["{HOME}/.claude.json", "{USERPROFILE}/.claude.json"]
format = "json"
at = ["projects", "{project}", "mcpServers"]
shape = "common"

[[source]]
name = "Cursor"
scope = "user"
paths = ["{HOME}/.cursor/mcp.json", "{USERPROFILE}/.cursor/mcp.json"]
