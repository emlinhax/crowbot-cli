# Where crowbot lives. `env` names the variable that overrides an origin (tests point it at a fake).
[origins.api]
url = "https://api.crowbot.sh"
env = "CROWBOT_API_URL"

[origins.chat]
url = "https://chat.crowbot.sh"
env = "CROWBOT_CHAT_URL"

[endpoints.models]
origin = "api"
method = "GET"
path = "/v1/models"

[endpoints.chat]
origin = "api"
method = "POST"
path = "/v1/chat/completions"
auth = true

[endpoints.me]
origin = "api"
method = "GET"
path = "/api/me"
auth = true

[endpoints.pair_start]
origin = "api"
method = "POST"
path = "/api/pair/start"

[endpoints.pair_poll]
origin = "api"
method = "GET"
path = "/api/pair/{code}"

# A web page, not an API: where a person approves a pairing code.
[endpoints.pair_page]
origin = "chat"
method = "GET"
path = "/pair"

[endpoints.pow]
origin = "chat"
method = "GET"
path = "/api/pow?kind={kind}"

[endpoints.signup]
origin = "chat"
method = "POST"
path = "/api/signup"
