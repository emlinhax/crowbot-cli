# How each tool call looks in the transcript; tools without a section use [default], key by key.
# `title`: argument names, the first present one titles the card (`title_join` joins all present);
# a list arg shows `title_items` items, past that one fewer and "+N". `body`: none, diff
# (details.diff), head, tail or summary, cut to `max_lines`. `summary`: a template over the
# result's details, `{ count, one, many }` for a counted form, or a list whose first complete
# entry shows.

[default]
title = ["path", "command", "pattern", "url", "query"]
body = "none"
max_lines = 1
title_items = 3

[read]
body = "summary"
summary = [
  "lines {lines.0}-{lines.1} of {total}",
  { count = "files", one = "{n} file", many = "{n} files" },
  { count = "entries", one = "{n} entry", many = "{n} entries" },
]

[write]
body = "summary"
summary = { count = "lines", one = "{n} line", many = "{n} lines" }

[edit]
body = "diff"
max_lines = 20

[bash]
body = "tail"
max_lines = 8

[glob]
body = "summary"
summary = { count = "files", one = "{n} file", many = "{n} files" }

[grep]
body = "summary"
summary = [
  { count = "matches", one = "{n} match", many = "{n} matches" },
  { count = "files", one = "{n} file", many = "{n} files" },
]

[fs]
title = ["action", "path", "to"]
title_join = " · "
body = "summary"
summary = { count = "paths", one = "{n} path", many = "{n} paths" }

[webfetch]
body = "head"
max_lines = 3

[codesearch]
body = "head"
max_lines = 6

[todowrite]
title = []
body = "head"
max_lines = 12

[question]
title = ["questions.0.question"]
body = "head"
# "The user answered:", then a question and its answer on two lines each.
max_lines = 9

[plan_exit]
title = []
body = "head"
max_lines = 1

# The forum tools fold to one line: the forum, then its section, topic or search term.
[forum_sections]
title = ["forum"]
body = "none"

[forum_topics]
title = ["forum", "section"]
title_join = " › "
body = "none"

[forum_thread]
title = ["forum", "topic"]
title_join = " › "
body = "none"

[forum_search]
title = ["forum", "query"]
title_join = " · "
body = "none"

[forum_post]
title = ["forum", "section", "topic"]
title_join = " › "
body = "none"
