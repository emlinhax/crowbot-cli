# How each tool call looks in the transcript. `title` lists argument names; the first one present
# titles the card. `body` is one of: none, diff (details.diff), head, tail, summary.
# `summary` fills {placeholders} from the result's details, or counts one of them:
# `{ count = "<key>", one = "…{n}…", many = "…{n}…" }` picks the form for that number.
# Tools without a section use [default].

[default]
title = ["path", "command", "pattern", "url", "query"]
body = "none"

[read]
body = "summary"
summary = "lines {lines.0}-{lines.1} of {total}"

[write]
body = "summary"
summary = { count = "lines", one = "{n} line", many = "{n} lines" }

[edit]
body = "diff"
max_lines = 20

[bash]
body = "tail"
max_lines = 8

[glob]
body = "summary"
summary = { count = "files", one = "{n} file", many = "{n} files" }

[grep]
body = "summary"
summary = { count = "matches", one = "{n} match", many = "{n} matches" }

[webfetch]
body = "head"
max_lines = 3

[codesearch]
body = "head"
max_lines = 6

[todowrite]
title = []
body = "head"
max_lines = 12

[question]
title = ["question"]
body = "head"
max_lines = 1

[plan_exit]
title = []
body = "head"
max_lines = 1
