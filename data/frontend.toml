# What both frontends say about a run; {placeholders} are filled in. The session adds its own
# hints around these (data/ui.toml).
interrupted = "Interrupted."
cut_off = "The reply hit its output limit (a low balance lowers that limit)."
unsaved = "No longer saving this session to {path}: {error}. The conversation goes on unsaved."
turn_limit = "Stopped after {count} turns."
retrying = "retrying in"

# Lines only a headless run prints, on stderr beside the reply.
[print]
call = "› {tool}"
failed = "  ✗ {error}"
needs_permission = "  ✗ {tool} needs permission ({what}); rerun with --mode auto to allow it"
hint = "  {hint}"
