# Built-in settings; ~/.crowbot/config.toml, .crowbot/config.toml and flags override them in that
# order. `[[permission]]` rules are appended instead, and the last matching rule wins.
model = "crow-2"
mode = "manual"
# A release build replaces itself with the newest release once a day, in the background of an
# interactive session; `crowbot update` does it on demand. CROWBOT_NO_UPDATE turns it off too.
auto_update = true

[[permission]]
permission = "*"
pattern = "*"
action = "ask"

[[permission]]
permission = "read"
pattern = "*"
action = "allow"

# Secrets: reading them still asks.
[[permission]]
permission = "read"
pattern = "*.env"
action = "ask"

[[permission]]
permission = "read"
pattern = "*.env.*"
action = "ask"

[[permission]]
permission = "search"
pattern = "*"
action = "allow"

# grep and glob read contents too; a secret as their root asks like a read does.
[[permission]]
permission = "search"
pattern = "*.env"
action = "ask"

[[permission]]
permission = "search"
pattern = "*.env.*"
action = "ask"

[[permission]]
permission = "codesearch"
pattern = "*"
action = "allow"

[[permission]]
permission = "todo"
pattern = "*"
action = "allow"

# Asking the user and handing over a plan are conversations, not actions.
[[permission]]
permission = "question"
pattern = "*"
action = "allow"

[[permission]]
permission = "plan_exit"
pattern = "*"
action = "allow"
