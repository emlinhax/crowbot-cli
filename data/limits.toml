# Every number the program is bound by, with the reason it is that number.

[http.connect_timeout_ms]
value = 10000
reason = "a dead network should fail fast; slow responses are bounded separately"

[http.request_timeout_ms]
value = 30000
reason = "account calls are small; anything slower is a stuck connection"

[http.error_body_ms]
value = 5000
reason = "an error's body follows its headers at once; one that trails is a stuck connection"

[http.error_body_bytes]
value = 16384
reason = "error envelopes are well under 1 KiB, and only their start is shown"

[http.error_text_chars]
value = 200
reason = "a server's own words past this crowd a one-line notice"

[models.fetch_timeout_ms]
value = 2500
reason = "on the startup path a stale model list beats a slow start (same bound as crowbot's opencode plugin)"

[models.cache_ttl_secs]
value = 3600
reason = "prices and limits change without a deploy, but not by the minute"

[chat.headers_timeout_secs]
value = 120
reason = "crowbot may hold a request while it sizes it against the balance and waits for an upstream slot"

[chat.idle_timeout_secs]
value = 120
reason = "crowbot sends keepalives during long thinking, so two silent minutes means a dead stream"

[chat.max_event_bytes]
value = 8388608
reason = "an event is a few tokens, a whole reply at most; megabytes past that without a newline is a broken stream"

[retry.max_attempts]
value = 5
reason = "enough to ride out a brief upstream blip without hiding a real outage"

[retry.initial_delay_ms]
value = 2000
reason = "long enough for a rate limit or upstream hiccup to clear"

[retry.factor]
value = 2
reason = "exponential backoff"

[retry.max_delay_ms]
value = 30000
reason = "cap on the backoff when crowbot gives no Retry-After"

[retry.jitter_pct]
value = 25
reason = "spreads retries from parallel clients apart"

[retry.max_retry_after_secs]
value = 120
reason = "a longer wait is better shown to the user than slept through"

[pair.poll_interval_ms]
value = 2000
reason = "the same cadence crowbot's own installer uses; approval is a human action"

[pair.backoff_ms]
value = 5000
reason = "pause after crowbot rate-limits the polling"

[signup.max_attempts]
value = 3
reason = "crowbot raises the difficulty per address; a third stale challenge means something else is wrong"

[signup.max_bits]
value = 30
reason = "the most work a person waits for on one machine; crowbot itself caps signup at 28 bits"

[agent.max_turns]
value = 100
reason = "a runaway loop on crow-2 costs real money; a run that needs more should be continued deliberately"

[agent.instructions_bytes]
value = 32768
reason = "a project's AGENTS.md is a few KiB; more would crowd every request it rides on"

[agent.doom_loop_repeats]
value = 3
reason = "the same call three times in a row is a loop, not persistence (opencode's threshold)"

[tools.max_lines]
value = 2000
reason = "about what a model can use from one read; more is noise that costs input tokens"

[tools.max_bytes]
value = 51200
reason = "caps one tool result near 12k tokens however long the lines are"

[tools.max_line_chars]
value = 2000
reason = "one minified line would otherwise use the whole budget"

[tools.max_results]
value = 100
reason = "more matches than this means the search should be narrower"

[tools.grep_line_chars]
value = 500
reason = "a match line is context, not content; read the file for the rest"

[update.check_interval_secs]
value = 86400
reason = "a day: releases come a few times a week, and a check costs a request to GitHub, which allows 60 an hour per address"

[update.download_timeout_secs]
value = 300
reason = "a release binary is about 16 MB; five minutes allows a slow link without hanging forever"


[forums.page_size]
value = 20
reason = "topics or posts fetched per page, matching what the Tapatalk app requests"


[tools.question_max]
value = 4
reason = "a card of tabs a person answers in one go; more is a form, not a question"

[tools.list_entries]
value = 500
reason = "a directory listing past this is better explored with glob"

[tools.binary_sniff_bytes]
value = 8192
reason = "a NUL byte this early means the file is not text (git uses the same window)"

[tools.bash_timeout_secs]
value = 120
reason = "default wait for a command; long builds pass a larger timeout"

[tools.bash_max_timeout_secs]
value = 600
reason = "the longest a model may ask to wait on one command"

[tools.bash_drain_ms]
value = 250
reason = "after the shell exits, output still in flight gets this long before the pipes close"

[tools.bash_memory_bytes]
value = 262144
reason = "output held in memory before the rest goes to a spill file; a few max_bytes, since escapes and redrawn progress lines shrink it"

[tools.bash_spill_keep_days]
value = 7
reason = "a spill is read in the turn that made it; older ones only fill the disk"

[tools.bash_spill_max_bytes]
value = 67108864
reason = "a spill the model can page through; a command printing forever stops filling the disk here"

[tools.webfetch_max_bytes]
value = 5242880
reason = "larger pages are rarely text a model can use"

[tools.webfetch_timeout_secs]
value = 30
reason = "a page slower than this is not worth holding the turn for"

[edit.anchor_similarity_pct]
value = 65
reason = "how alike the middle of a block must be when only its first and last lines match exactly"

[edit.size_tolerance_pct]
value = 25
reason = "a fuzzy match this much longer or shorter than the text it replaces is a different block"

[edit.similarity_max_chars]
value = 20000
reason = "edit distance is quadratic; longer texts count as unlike, both as block middles and as closest lines"

[edit.hint_max_cells]
value = 2000000
reason = "edit-distance cells the closest-line hint may spend over the whole file; past this it is skipped"

[edit.hint_similarity_pct]
value = 50
reason = "a closest line less alike than this points the model at the wrong place"

[tui.frame_ms]
value = 16
reason = "about 60 frames a second; streaming never needs more"

[tui.spinner_ms]
value = 80
reason = "a braille spinner reads as motion at this step"

[tui.paste_gap_ms]
value = 5
reason = "pasted keys arrive together; people type tens of milliseconds apart"

[tui.paste_min_keys]
value = 3
reason = "two quick keys can be a chord; three in a row is a paste"

[tui.editor_max_rows_pct]
value = 30
reason = "the editor may take this share of the screen before it scrolls (pi's choice)"

[tui.reasoning_tail_lines]
value = 3
reason = "enough to see the model is thinking without pushing the answer off screen"

[tui.error_lines]
value = 3
reason = "a failed tool shows the start of its error; the model gets all of it"

[tui.quit_window_ms]
value = 1000
reason = "a second Ctrl+C within this window quits, so one stray press does not"

[tui.history_max]
value = 100
reason = "prompts kept for Up/Down in one session"

[tui.prompt_body_lines]
value = 16
reason = "a permission preview shows this much of a diff before cutting it short"

[tui.status_frame_ms]
value = 90
reason = "eight frames carry the flock through one rise and fall in about three quarters of a second, calm but alive"

[tui.shimmer_ms]
value = 70
reason = "the glint crosses a ten-letter verb in about a second"

[tui.scroll_lines]
value = 3
reason = "rows one wheel notch scrolls the transcript; terminals scroll their own buffers by three"

[tui.palette_rows]
value = 8
reason = "the command popup lists this many before it scrolls; the editor stays in view"

[tui.toast_ms]
value = 1500
reason = "long enough to read one word, gone before it hides anything for long"

[forums.batch_max]
value = 8
reason = "threads, topic pages or searches fetched in one batched forum tool call, run at once; enough to be useful without hammering the forum"
