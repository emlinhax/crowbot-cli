# What a project's .crowbot/config.toml may set before the folder is trusted: what crowbot runs on,
# never what it may do (mode or shell could run commands unasked). Deny rules are kept too.
untrusted_keys = ["model", "effort"]

# What crowbot says when a project's config sets what only a trusted folder may.
warning = "{file} changes what crowbot may do without asking:"
danger = "A malicious repository can use this to make crowbot run commands without asking."
question = "Trust this folder and use these settings?"
declined = "Not trusted; ignoring them."
ignored = "ignoring {keys} from {file}: the folder isn't trusted. Start crowbot here in a terminal to trust it."
