# A section for each MCP server that sent instructions with its tools, after the forums and before
# the project's own; omitted when none did. {server} is its name in crowbot, {text} what it said.
frame = """
<mcp-server-instructions server="{server}">
{text}
</mcp-server-instructions>"""
# {max} is `mcp.instructions_chars`.
cut = "[The rest of these instructions is left out: they run past {max} characters.]"
