# What the command line says about itself; {placeholders} are filled from the catalogs, so a new
# level, mode or command shows up with no edit here.

# Each flag's help, by its id.
[help]
model = "Model id for this run (see `crowbot models`)"
effort = "Reasoning effort for this run: {levels}"
mode = "Permission mode for this run: {modes}"
print = "Send the words as a prompt, never a command; print the reply, exit"
json = "Like --print, but stream every event as a JSON line"

[text]
commands = "Commands: {commands}. Other words are the prompt."
misplaced_flag = "`{flag}` goes before the words; quote a prompt that contains it"
