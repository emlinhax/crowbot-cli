id = "plan"
label = "PLAN"
color = "mode_plan"
order = 1
summary = "Read-only: investigates and writes a plan, changes nothing"
reminder = "plan_mode"

[verdicts]
ask = "ask"
deny = "deny"
doom_loop = "ask"

# Locks apply after every other rule, so no config or approval can lift them.
[[lock]]
permission = "edit"
pattern = "*"
action = "deny"

[[lock]]
permission = "edit"
pattern = "{plan_file}"
action = "allow"

[[lock]]
permission = "external_directory"
pattern = "{plan_file}"
action = "allow"

[[lock]]
permission = "bash"
pattern = "*"
action = "deny"

[[lock]]
permission = "bash_complex"
pattern = "*"
action = "deny"

[[lock]]
permission = "bash_write"
pattern = "*"
action = "deny"

# Each command matches alone or followed by words, so `git difftool` or `lsof` doesn't pass as
# `git diff` or `ls`. No file reader here: `cat` and friends would skip the read tool's secret
# rules, so PLAN reads through read, grep and glob.
[[lock]]
permission = "bash"
pattern = "git status"
action = "allow"

[[lock]]
permission = "bash"
pattern = "git status *"
action = "allow"

[[lock]]
permission = "bash"
pattern = "git log"
action = "allow"

[[lock]]
permission = "bash"
pattern = "git log *"
action = "allow"

[[lock]]
permission = "bash"
pattern = "git diff"
action = "allow"

[[lock]]
permission = "bash"
pattern = "git diff *"
action = "allow"

[[lock]]
permission = "bash"
pattern = "git show"
action = "allow"

[[lock]]
permission = "bash"
pattern = "git show *"
action = "allow"

[[lock]]
permission = "bash"
pattern = "ls"
action = "allow"

[[lock]]
permission = "bash"
pattern = "ls *"
action = "allow"

[[lock]]
permission = "bash"
pattern = "pwd"
action = "allow"

# Flags that make an allowed git command write, run a diff program, or read outside the repo.
[[lock]]
permission = "bash"
pattern = "git *--output*"
action = "deny"

[[lock]]
permission = "bash"
pattern = "git *--ext-diff*"
action = "deny"

[[lock]]
permission = "bash"
pattern = "git *--no-index*"
action = "deny"
