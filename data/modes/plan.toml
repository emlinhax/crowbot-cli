id = "plan"
label = "PLAN"
color = "mode_plan"
order = 1
summary = "Investigates, runs checks and writes a plan; edits nothing else"
reminder = "plan_mode"

# Nothing PLAN lets through edits the project, so a repeated call is for the model to notice, not
# a question for the user.
[verdicts]
ask = "ask"
deny = "deny"
doom_loop = "tell_model"

# Locks apply after every other rule, so no config or approval can lift them; the last match wins.
[[lock]]
permission = "edit"
pattern = "*"
action = "deny"

[[lock]]
permission = "edit"
pattern = "{plan_file}"
action = "allow"

[[lock]]
permission = "external_directory"
pattern = "{plan_file}"
action = "allow"

[[lock]]
permission = "bash"
pattern = "*"
action = "deny"

[[lock]]
permission = "bash_complex"
pattern = "*"
action = "deny"

[[lock]]
permission = "bash_write"
pattern = "*"
action = "deny"

# Inspection (data/command_lists.toml). No file reader (`cat`, `head`, `grep` on a file): those
# would skip the read tool's secret rules, so PLAN reads through read, grep and glob. At the end of
# a pipe they read only what is piped in, and run (data/filters.toml).
[[lock]]
permission = "bash"
action = "allow"
list = "inspect"

# Checks run the project's own code and write only build output, never the source.
[[lock]]
permission = "bash"
action = "allow"
list = "checks"

[[lock]]
permission = "bash"
action = "deny"
list = "unsafe_flags"

# Reading the web changes nothing here; a user's deny rule for a host still holds.
[[lock]]
permission = "webfetch"
pattern = "*"
action = "allow"
