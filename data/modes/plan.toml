id = "plan"
label = "PLAN"
color = "mode_plan"
order = 1
summary = "Investigates, runs checks and writes a plan; edits nothing else"
# Told to the model when the mode takes effect; {plan_file} is filled in.
reminder = '''
You are in PLAN mode. Investigate and plan; change nothing but the plan file.
- Read, find and search files with `read`, `glob` and `grep`; they run without asking. In the shell, `cat`, `head`, `tail`, `wc` and non-recursive `grep` on files you name count as reads too; `sed`, `awk`, scripts and recursive greps are refused.
- The shell runs, without asking, git's read commands (status, log, diff, show, blame, grep, branch), listings (ls, tree, find, wc, du) and checks: builds, tests and linters such as `cargo check`, `cargo test`, `make test` or `npm test`. `head`, `tail`, `grep` and `wc` work at the end of a pipe.
- `webfetch` runs without asking.
- Anything that edits files, installs or changes state is refused. Don't retry a refused call; find another way, or put the step in the plan.
- Write your plan to {plan_file}: the goal, the files involved, the steps in order, and how to verify the result. Keep it concrete enough to execute without re-investigating.
- Finish by summarising the plan for the user and saying it is ready to implement.
'''
# This mode writes the session's plan and hands it over with plan_exit.
plan_exit = true

# Nothing PLAN lets through edits the project, so a repeated call is for the model to notice, not
# a question for the user.
doom_loop = "tell_model"

[verdicts]
ask = "ask"
deny = "deny"

# Locks apply after every other rule, so no config or approval can lift them; the last match wins.
[[lock]]
permission = "edit"
pattern = "*"
action = "deny"

[[lock]]
permission = "edit"
pattern = "{plan_file}"
action = "allow"

[[lock]]
permission = "external_directory"
pattern = "{plan_file}"
action = "allow"

[[lock]]
permission = "bash"
pattern = "*"
action = "deny"

[[lock]]
permission = "bash_complex"
pattern = "*"
action = "deny"

[[lock]]
permission = "bash_write"
pattern = "*"
action = "deny"

# An MCP server's tool may change anything.
[[lock]]
permission = "mcp_write"
pattern = "*"
action = "deny"

# Inspection (data/command_lists.toml). File readers (`cat`, `head`, `grep` on named files) are not
# commands here: they ask as reads of their files (data/filters.toml), so the read rules, secrets
# included, decide them as they decide the read tool.
[[lock]]
permission = "bash"
action = "allow"
list = "inspect"

# Checks run the project's own code and write only build output, never the source.
[[lock]]
permission = "bash"
action = "allow"
list = "checks"

[[lock]]
permission = "bash"
action = "deny"
list = "unsafe_flags"

# Reading the web changes nothing here; a user's deny rule for a host still holds.
[[lock]]
permission = "webfetch"
pattern = "*"
action = "allow"
