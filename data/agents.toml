# The comment a role file written by /models opens with. `{id}` is not used: the file's own keys
# say everything, and data/agents/ has the annotated originals.
text = """# A role the `task` tool can start, written by /models. Every key is in data/agents/reader.toml:
# `summary` is what the model is told it is for, `tools` are the session's tools by name (`*` is
# all of them, `except` leaves some out), `prompt` is added to the session's system prompt for it,
# and `model`/`effort` are optional: without them it runs on the session's.
"""

# What `task` dispatches when no role is turned on: the session's own model, effort, tools and
# prompt, under this name, so the agent can still hand work over. It is not a tab in /models;
# turning any role on puts it away.
[fallback]
id = "general"
summary = "Does one self-contained piece of work with the tools and model of the session itself."
