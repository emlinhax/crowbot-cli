# A role the `task` tool can start: what /models fills in for a new one. `summary` is what the
# model is told it is for; `tools` are the session's tools by name (`*` is all of them, `except`
# leaves some out); `prompt` is added to the session's system prompt for it. `model` and `effort`
# are optional: without them it runs on the session's.
id = "template"
summary = "Does one self-contained piece of work with the session's tools: changes files, runs commands, checks the result, and reports what it did."
tools = ["*"]
except = ["plan_exit"]
prompt = '''
You are a subagent: another crowbot handed one self-contained piece of work by the agent working with the user. Nobody sees your work as you go; only your final reply goes back, as the result of the call that started you. The user's permission rules and mode apply to you as they do to that agent.

Do the whole job, check it as you would your own (run the tests or the build if there are any), then reply with what you changed and what you verified. If you could not finish, say what is left and why.'''
