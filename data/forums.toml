# Tapatalk's directory, the seeded forums and the add-flow suggestions. `kind` picks a forum's
# backend; only `mobiquo` exists.

[directory]
url = "https://apis.tapatalk.com"
path = "/search_forum_v2"
# The Tapatalk app's own id and key, read from the published app — public, not a secret.
# CEILING: if Tapatalk retires these, discovery stops; the upgrade is new values or crowbot's own key.
app_id = "1"
app_key = "hdp3jtrujmsUis3r"

# What a failed call says when the forum gives no reason of its own.
[text]
refused = "the forum refused the request"
rejected = "the forum rejected the post"
login_failed = "login failed"
unreadable = "reading {method} from {forum}"

# The list until forums.json exists. A forum can rotate its mobiquo dir; on 404s,
# `crowbot forums add <name>` re-resolves it and keeps the login.
[[seed]]
id = "79565"
name = "UnknownCheats"
hint = "Game hacking and reverse engineering community (UC). Cheats, aimbots, ESP/wallhacks, memory editing, internal/external hacks, anti-cheat (BattlEye, EAC, Vanguard) bypasses, DLL injection; per-game boards (CS2, CoD/Warzone, Apex, Fortnite, Rust, Valorant, GTA and more); C/C++, C#, x86/x64 assembly, IDA/Cheat Engine, and tutorials/source releases."
base_url = "https://www.unknowncheats.me/forum"
mobiquo_dir = "euehhp13n8dqw77"
ext = "php"
kind = "mobiquo"

# Searches offered first when adding a forum. Each resolves live, so a forum that left Tapatalk just
# won't add.
[[suggest]]
query = "unknowncheats"
[[suggest]]
query = "mpgh"
[[suggest]]
query = "guided hacking"
[[suggest]]
query = "tuts4you"
[[suggest]]
query = "hackforums"
