name = "forums"
aliases = ["forum"]
summary = "Forums the agent can browse: add one, log in, or see the list"
usage = "forums [list | add <url or name> | login <forum> | logout <forum> | remove <forum> | search <forum> <words>]"

# What the forums command says; {placeholders} are filled in.
[text]
empty = "No forums added yet. Add one with `{add}`."
heading = "Forums the agent can browse:"
row_guest = "  {name} ({host}) — guest"
row_login = "  {name} ({host}) — logged in as {user}"
added = "Added {name} ({host}). The agent can browse it now; log in with `{login}` to search and post."
not_found = "No forum matches {forum}. Run `{list}` to see them, or `{add}` to add one."
needs_terminal = "Logging in needs a terminal. Run `crowbot forums login {forum}` in one, or type `! crowbot forums login {forum}` here."
cancelled = "Cancelled; nothing changed."
logged_in = "Logged in to {name} as {user}."
logged_out = "Logged out of {name}; it stays added as a guest."
removed = "Removed {name}."
username_prompt = "Username for {name}: "
password_prompt = "Password (hidden): "
no_results = "No topics matched."
