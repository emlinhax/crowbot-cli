name = "status"
summary = "Show the account, model, mode, context use and cost of this session"
usage = "status"
scope = ["session"]

# What /status shows; {placeholders} are filled in.
[text]
body = """
- Account: {account}
- Model: {model}
- Mode: {mode}
- Context: {context}
- This session: about {cost}
- Undo: {undo}
- MCP: {mcp}
- Session file: `{file}`
- Project: `{project}`"""
balance = "{login} {standing}"
balance_failed = "{login} The balance did not load: {error}"
effort = "{model}, effort {effort}"
context = "{pct}% of the window, as of the last request"
no_context = "nothing sent yet"
undo_files = "takes back a prompt and the files it changed"
undo_conversation = "takes back a prompt, not its files: {why}"
mcp_none = "no servers in config.toml"
# `{name}` below is one of these: the server's name, or it and the apps it was found in.
mcp_name = "`{name}`"
mcp_found = "`{name}` ({from})"
mcp_running = { one = "{name}, {n} tool", many = "{name}, {n} tools" }
mcp_failed = "{name} not running ({why})"
mcp_stopped = "{name} stopped"
mcp_off = "{name} off"
