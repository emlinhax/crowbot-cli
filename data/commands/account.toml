name = "account"
summary = "See where the account stands and what it spent, set balance fallback, revoke keys"
usage = "account"
scope = ["session"]

# How the account stands, here and wherever login and /status report it; {placeholders} are
# filled in.
[text]
balance = "Balance {balance}."
