# What plan_exit tells the model, and what the user can do with a finished plan; {placeholders}
# are filled in.
only = "plan_exit only works in PLAN mode."
missing = "Write the plan to {plan_file} before calling plan_exit."
approved = "The user approved the plan and switched to {mode} mode. Implement it now, step by step."
keep = "The user wants to keep planning. Ask what to change, or refine the plan and call plan_exit again."
changes = "The user wants changes to the plan: {feedback}\nUpdate the plan file and call plan_exit again."
edited = "The user edited the plan; it now reads:\n\n{plan}\n\n{said}"
unavailable = "Nobody can approve the plan in this run. Stop and summarise the plan."
unknown_mode = "unknown mode `{mode}`"

# A choice with a `mode` switches to it and starts implementing; one without keeps planning.
[[choice]]
label = "Implement it in MANUAL mode (ask before each change)"
mode = "manual"

[[choice]]
label = "Implement it in AUTO mode (no questions)"
mode = "auto"

[[choice]]
label = "Keep planning"
