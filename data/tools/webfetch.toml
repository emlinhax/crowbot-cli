# What webfetch tells the model when a page does not arrive; {placeholders} are filled in. Pages
# that need a real browser say so plainly, so the model stops rather than retrying.
failed = "Could not fetch {url}: {error}"
status = "{url} answered HTTP {status}."
firewall = "{url} is blocked by Cloudflare's firewall (HTTP {status}); retrying will not help."
challenge = "{url} is behind a Cloudflare challenge that no browser profile passed: {error}. It needs a real browser; do not retry."
browser = "{url} asks for an interactive Cloudflare check that needs a real browser; do not retry."
slow = "{url} took too long to answer."
cut = "[Page cut at {kept} of {total} lines.]"
