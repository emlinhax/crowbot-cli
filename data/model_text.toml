# What crowbot says to the model on the user's behalf. `{name}` placeholders are filled in.

no_result = "No result: this call was interrupted before it finished."
cancelled = "Cancelled by the user before it finished."
truncated_tool_call = "Not run: your reply hit its output limit, so these arguments may be cut off. Make the call again with less in it."
unknown_tool = "There is no tool named `{name}`. Available tools: {available}."
bad_json = "The arguments are not valid JSON: {error}"
invalid_arguments = "Invalid arguments for {name}: {error}"
denied = "Not allowed by the user's permission rules: {what}."
rejected = "The user declined this call."
rejected_with_feedback = "The user declined this call and said: {feedback}"
non_interactive = "This needs the user's permission ({what}), and nobody can answer in this non-interactive run. Tell the user to rerun with --mode auto if they want it allowed."
doom_loop = "You have made this exact call {count} times in a row. Stop repeating it and change approach."
max_turns = "Stopped after {count} model turns in one run; the user can continue if more is needed."
question_chosen = "The user chose: {answer}"
question_answered = "The user answered: {answer}"
question_dismissed = "The user dismissed the question without answering."
question_unavailable = "Nobody can answer questions in this run; decide yourself and say what you assumed."
plan_missing = "Write the plan to {plan_file} before calling plan_exit."
plan_approved = "The user approved the plan and switched to {mode} mode. Implement it now, step by step."
plan_keep = "The user wants to keep planning. Ask what to change, or refine the plan."
plan_changes = "The user wants changes to the plan: {feedback}"
plan_unavailable = "Nobody can approve the plan in this run. Stop and summarise the plan."
plan_only = "plan_exit only works in PLAN mode."
