# Fence names the bundled grammars know by another name. Languages without a grammar (TOML,
# PowerShell, …) stay uncoloured.
[alias]
ts = "js"
tsx = "js"
typescript = "js"
jsx = "js"
mjs = "js"
cjs = "js"
jsonc = "json"
sh = "bash"
zsh = "bash"
shell = "bash"
console = "bash"
yml = "yaml"
dockerfile = "bash"
