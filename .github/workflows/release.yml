name: release

# Every push to `prod` is a release: the full checks, then one binary per target, published
# under fixed names so `releases/latest/download/crowbot-<target>` always serves the newest.
on:
  push:
    branches: [prod]

# Releases go out one at a time, in push order.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The tag is worked out once: the release builds carry it (`crowbot --version`, the updater)
  # and the release is published under it.
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "tag=v$version-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  check:
    needs: tag
    uses: ./.github/workflows/ci.yml
    with:
      publish: true
      release: ${{ needs.tag.outputs.tag }}

  publish:
    needs: [tag, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum crowbot-* > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest
