name: release

# Every push to `prod` is a release: the full checks, then one binary per target, published
# under fixed names so `releases/latest/download/crowbot-<target>` always serves the newest.
on:
  push:
    branches: [prod]

# Releases go out one at a time, in push order.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # One tag for the builds (`--version`, the updater) and the release.
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "tag=v$version-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      # A release the updater would refuse is not worth building: fail before the builds start.
      - env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::MINISIGN_SECRET_KEY is not set; releases are signed with it"
            exit 1
          fi

  check:
    needs: tag
    uses: ./.github/workflows/ci.yml
    with:
      publish: true
      release: ${{ needs.tag.outputs.tag }}

  publish:
    needs: [tag, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum crowbot-* > SHA256SUMS
      # The updater takes a release only once SHA256SUMS carries this signature, its trusted
      # comment naming the release (data/release.toml [signature]).
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          minisign -S -s "$key" -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig \
            -t "crowbot release $TAG" < /dev/null
      # One line installs the release: `curl -fsSL …/latest/download/install.sh | sh`.
      - run: cp install/install.sh install/install.ps1 dist/
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest
