name: ci

on:
  push:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: make lint
      - run: make test
      - run: make e2e
      # The release build README documents; a release job for `prod` comes later (NEXT_PLAN M7).
      - run: make build && ls -l target/release/

  # Fully static Linux. BoringSSL needs a musl C++ cross toolchain, which this image carries.
  # Allowed to fail until a green run proves it; until then glibc above is the Linux target.
  release-musl:
    runs-on: ubuntu-latest
    continue-on-error: true
    container: ghcr.io/rust-cross/rust-musl-cross:x86_64-musl
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          target: x86_64-unknown-linux-musl
      - run: make build TARGET=x86_64-unknown-linux-musl && ls -l target/x86_64-unknown-linux-musl/release/
