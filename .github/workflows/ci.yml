name: ci

on:
  push:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version and components.
      - run: rustup toolchain install
      - uses: ./.github/actions/boringssl
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Windows'
        run: command -v make || choco install make -y --no-progress
      - run: make lint
      - run: make test
      - run: make e2e

  # Proves every release target still builds; the real release job lives on `prod`.
  release-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: ./.github/actions/boringssl
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - run: ls -l target/${{ matrix.target }}/release/

  # Fully static Linux. BoringSSL needs a musl C++ cross toolchain, which this image carries.
  # Allowed to fail until a green run proves it; until then glibc above is the Linux target.
  release-musl:
    runs-on: ubuntu-latest
    continue-on-error: true
    container: ghcr.io/rust-cross/rust-musl-cross:x86_64-musl
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/boringssl
      - run: rustup toolchain install && rustup target add x86_64-unknown-linux-musl
      - run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - run: ls -l target/x86_64-unknown-linux-musl/release/
