name: ci

on:
  push:
    branches: [main]
  # release.yml runs these same checks on `prod`, then publishes the binaries they built.
  workflow_call:
    inputs:
      publish:
        description: Keep each release target's binary for the release job.
        type: boolean
        default: false
      release:
        description: The release tag the binaries are built as (`crowbot --version`, the updater).
        type: string
        default: ""

# Nothing here writes to the repository, so third-party actions get a read-only token.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          # Each release target builds on its own host (musl in its container below), so this
          # job's checks cover it.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
          # Fully static Linux, the Linux release target. BoringSSL needs a musl C++ cross
          # toolchain, which this image carries; the host entry above runs the checks.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            container: ghcr.io/rust-cross/rust-musl-cross:x86_64-musl
            build_only: true
    runs-on: ${{ matrix.os }}
    # Empty for every entry but musl's, which runs the job on the host.
    container: ${{ matrix.container }}
    # Bound set by a cold BoringSSL build; stops a hung PTY test holding runners for 6 h.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          target: ${{ matrix.target }}
      # An entry that leaves `build_only` out is null here, and null equals false in these
      # expressions (both are 0), so the flag says what to skip, never what to run.
      - if: ${{ !matrix.build_only }}
        run: make lint
      - if: ${{ !matrix.build_only }}
        run: make test
      - if: ${{ !matrix.build_only }}
        run: make e2e
      - run: make build TARGET=${{ matrix.target }}
        env:
          CROWBOT_RELEASE: ${{ inputs.release }}
      - if: inputs.publish && matrix.target
        uses: ./.github/actions/asset
        with:
          target: ${{ matrix.target }}
          exe: ${{ matrix.exe }}
