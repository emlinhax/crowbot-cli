code = '''void __cdecl handle_client(int client, struct config *cfg)
{
  char line[1024];
  struct header hdr;

  while ( recv_line(client, line, 1024) > 0 )
  {
    if ( line[0] == '#' )
    {
      sub_401f20(client);
      continue;
    }
    if ( line[0] == '?' )
    {
      sub_401e00(client, cfg);
      continue;
    }
    if ( sub_401890(line, strlen(line), &hdr) == 0 )
      write_log(cfg, &hdr, line + hdr.offset);
  }
}'''
