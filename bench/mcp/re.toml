comment = ""
calls = "0x402080 (sub_402080)"
code = '''int __cdecl sub_4011a0(const char *path, struct config *cfg)
{
  FILE *f;
  char line[256];

  f = fopen(path, "r");
  if ( !f )
    return -1;
  cfg->port = 5140;
  while ( fgets(line, 256, f) )
  {
    if ( !strncmp(line, "port=", 5) )
      cfg->port = atoi(line + 5);
    else if ( !strncmp(line, "log_dir=", 8) )
      cfg->log_dir = sub_402080(line + 8);
  }
  fclose(f);
  return 0;
}'''
