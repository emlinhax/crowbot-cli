# A simulated reverse-engineering server, shaped like ida-pro-mcp: a database to open first, many
# tools, functions found by hex address, long decompiled answers, a list paged by offset, strings
# paged by cursor, and one busy first call. The binary is `netlogd`, a small logging daemon.
name = "re"
instructions = "Open the database with idb_open before anything else. Addresses are hex strings such as 0x401000."

[flags.open]
missing = "No database is open: call idb_open with the path of the binary first."

[[collections.functions]]
address = "0x401000"
name = "main"
size = 214
prototype = "int __cdecl main(int argc, char **argv)"
comment = ""
calls = "0x4011a0 (sub_4011a0), 0x401300 (open_listener), 0x401480 (accept_loop)"
code = '''int __cdecl main(int argc, char **argv)
{
  struct config cfg;
  int fd;

  if ( sub_4011a0(argc > 1 ? argv[1] : "/etc/netlogd.conf", &cfg) < 0 )
  {
    fprintf(stderr, "cannot read config\n");
    return 1;
  }
  fd = open_listener(cfg.port);
  if ( fd < 0 )
    return 2;
  return accept_loop(fd, &cfg);
}'''
asm = '''push    ebp
mov     ebp, esp
sub     esp, 40h
cmp     [ebp+argc], 1
jle     short loc_401019
mov     eax, [ebp+argv]
call    sub_4011A0
test    eax, eax
js      short loc_401090
call    open_listener
call    accept_loop
leave
retn'''

