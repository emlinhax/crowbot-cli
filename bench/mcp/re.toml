calls = "socket, bind, listen"
code = '''int __cdecl open_listener(int port)
{
  struct sockaddr_in addr;
  int fd;

  fd = socket(2, 1, 0);
  memset(&addr, 0, 16);
  addr.sin_family = 2;
  addr.sin_port = htons(port);
  if ( bind(fd, &addr, 16) < 0 || listen(fd, 16) < 0 )
    return -1;
  return fd;
}'''
