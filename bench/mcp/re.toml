[[tool]]
name = "idb_open"
description = "Open the IDA database for a binary. Must be called before any other tool."
schema = '{"type": "object", "properties": {"path": {"type": "string", "description": "Path of the binary or its .i64 database"}}, "required": ["path"], "additionalProperties": false}'
act = "text"
text = "Opened {path}: netlogd, x86, 25 functions, 13 strings, 12 imports."
sets = "open"

[[tool]]
name = "idb_info"
description = "Facts about the open database: architecture, entry point, counts."
schema = '{"type": "object", "properties": {}}'
read_only = true
requires = "open"
act = "text"
text = "netlogd: ELF x86 (32-bit), entry 0x400f80 (start), main at 0x401000, 25 functions, 13 strings, 12 imports."

[[tool]]
name = "list_segments"
description = "The segments of the binary with their address ranges."
schema = '{"type": "object", "properties": {}}'
read_only = true
requires = "open"
act = "text"
text = ".text 0x400f80-0x402300 (code)\n.rodata 0x406000-0x406200\n.idata 0x405000-0x405040 (imports)\n.data 0x407000-0x407100"

[[tool]]
name = "list_functions"
description = "Functions in address order, ten at a time; `query` keeps those whose name contains it."
schema = '{"type": "object", "properties": {"query": {"type": "string"}, "offset": {"type": "integer", "description": "Where the page starts, as the last page said"}}, "additionalProperties": false}'
read_only = true
requires = "open"
act = "list"
collection = "functions"
filter = { arg = "query", fields = ["name"] }
page = { size = 10, arg = "offset", kind = "offset" }
render = "{address} {name} ({size} bytes)"

[[tool]]
name = "get_function_by_name"
description = "A function's address, size and prototype, by its name."
schema = '{"type": "object", "properties": {"name": {"type": "string"}}, "required": ["name"], "additionalProperties": false}'
read_only = true
requires = "open"
act = "get"
collection = "functions"
key = "name"
render = "{address} {name} ({size} bytes): {prototype}"
missing = "No function named {name}."

[[tool]]
name = "get_function_by_address"
description = "The function containing an address: its name, size, prototype and comment."
