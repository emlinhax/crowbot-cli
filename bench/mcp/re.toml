render = "{refs}"
missing = "No references to {address}."
fail_first = "Auto-analysis is still running; try again in a moment."

[[tool]]
name = "xrefs_from"
description = "What the function at an address calls."
schema = '{"type": "object", "properties": {"address": {"type": "string"}}, "required": ["address"], "additionalProperties": false}'
read_only = true
requires = "open"
act = "get"
collection = "functions"
key = "address"
format = "hex"
render = "{name} calls: {calls}"
missing = "No function starts at {address}."

[[tool]]
name = "list_strings"
description = "Strings in the binary, eight at a time; `query` keeps those containing it. Pass the cursor the last page gave for the next."
schema = '{"type": "object", "properties": {"query": {"type": "string"}, "cursor": {"type": "string"}}, "additionalProperties": false}'
read_only = true
requires = "open"
act = "list"
collection = "strings"
filter = { arg = "query", fields = ["text"] }
page = { size = 8, arg = "cursor", kind = "cursor" }
render = "{address} \"{text}\""

[[tool]]
name = "get_string"
description = "The string at an address."
schema = '{"type": "object", "properties": {"address": {"type": "string"}}, "required": ["address"], "additionalProperties": false}'
read_only = true
requires = "open"
act = "get"
collection = "strings"
key = "address"
format = "hex"
render = "{address} \"{text}\""
missing = "No string at {address}."

[[tool]]
name = "list_imports"
description = "Imported functions with their addresses in the import table; `query` keeps names containing it."
schema = '{"type": "object", "properties": {"query": {"type": "string"}}, "additionalProperties": false}'
read_only = true
requires = "open"
act = "list"
collection = "imports"
filter = { arg = "query", fields = ["name"] }
render = "{address} {module}!{name}"

[[tool]]
name = "list_exports"
description = "Exported symbols."
schema = '{"type": "object", "properties": {}}'
read_only = true
requires = "open"
act = "text"
text = "0x400f80 start\n0x401000 main"

[[tool]]
name = "rename_function"
description = "Give the function at an address a new name."
schema = '{"type": "object", "properties": {"address": {"type": "string", "description": "Hex address of the function"}, "new_name": {"type": "string"}}, "required": ["address", "new_name"], "additionalProperties": false}'
requires = "open"
act = "update"
collection = "functions"
key = "address"
format = "hex"
set = { name = "new_name" }
text = "Renamed {address} to {name}."
missing = "No function starts at {address}."

[[tool]]
name = "set_comment"
description = "Set the comment of the function at an address, replacing any it had."
schema = '{"type": "object", "properties": {"address": {"type": "string"}, "comment": {"type": "string"}}, "required": ["address", "comment"], "additionalProperties": false}'
requires = "open"
act = "update"
collection = "functions"
key = "address"
format = "hex"
set = { comment = "comment" }
text = "Comment set on {address} ({name})."
missing = "No function starts at {address}."

[[tool]]
name = "set_function_prototype"
description = "Set the C prototype of the function at an address, e.g. `int __cdecl f(char *s)`."
schema = '{"type": "object", "properties": {"address": {"type": "string"}, "prototype": {"type": "string"}}, "required": ["address", "prototype"], "additionalProperties": false}'
requires = "open"
act = "update"
collection = "functions"
key = "address"
format = "hex"
set = { prototype = "prototype" }
text = "{address} is now {prototype}."
missing = "No function starts at {address}."

[[tool]]
name = "rename_local_variable"
description = "Rename a local variable in the function at an address."
schema = '{"type": "object", "properties": {"address": {"type": "string"}, "old_name": {"type": "string"}, "new_name": {"type": "string"}}, "required": ["address", "old_name", "new_name"], "additionalProperties": false}'
requires = "open"
act = "text"
text = "Renamed {old_name} to {new_name} in {address}."

[[tool]]
name = "get_bytes"
description = "Raw bytes at an address."
schema = '{"type": "object", "properties": {"address": {"type": "string"}, "size": {"type": "integer"}}, "required": ["address", "size"], "additionalProperties": false}'
read_only = true
requires = "open"
act = "text"
text = "{size} bytes at {address}: 55 8b ec 83 ec 40 53 56 57 8b 7d 08 85 ff 74 20"

[[tool]]
name = "search_bytes"
description = "Find a byte pattern such as `20 83 B8 ED` in the code."
schema = '{"type": "object", "properties": {"pattern": {"type": "string"}}, "required": ["pattern"], "additionalProperties": false}'
read_only = true
requires = "open"
act = "text"
text = "Searched for {pattern}: 1 match at 0x401c5c in sub_401c40."

[[tool]]
name = "list_structs"
description = "Structures defined in the database."
schema = '{"type": "object", "properties": {}}'
read_only = true
requires = "open"
act = "list"
collection = "structs"
render = "{name} ({size} bytes)"

[[tool]]
name = "get_struct"
description = "A structure's fields, by its name."
schema = '{"type": "object", "properties": {"name": {"type": "string"}}, "required": ["name"], "additionalProperties": false}'
read_only = true
requires = "open"
act = "get"
collection = "structs"
key = "name"
render = "struct {name}: {fields}"
missing = "No structure named {name}."

[[tool]]
name = "create_struct"
description = "Define a new structure from C field declarations."
schema = '{"type": "object", "properties": {"name": {"type": "string"}, "fields": {"type": "array", "items": {"type": "string"}}}, "required": ["name", "fields"], "additionalProperties": false}'
requires = "open"
act = "create"
collection = "structs"
set = { name = "name", fields = "fields" }
text = "Created struct {name}."

[[tool]]
name = "get_entry_points"
description = "The binary's entry points."
schema = '{"type": "object", "properties": {}}'
read_only = true
requires = "open"
act = "text"
text = "0x400f80 start\n0x401000 main"

[[tool]]
name = "make_function"
description = "Create a function at an address that analysis missed."
schema = '{"type": "object", "properties": {"address": {"type": "string"}}, "required": ["address"], "additionalProperties": false}'
requires = "open"
act = "text"
text = "A function already exists at {address}."

[[tool]]
name = "idb_save"
description = "Save the database."
schema = '{"type": "object", "properties": {}}'
requires = "open"
act = "text"
text = "Saved."
