# A simulated database: tables named by argument, rows matched by a `where` object and paged,
# a count the model may not think to use, inserts and updates by id, and a raw SQL tool that is
# turned off, as many hosted databases' MCP servers keep it. The shop's numbers the battery's
# checks expect: Acme Corp's paid orders total 4574.0, 4 orders are pending, order 1017 was
# marked refunded.
name = "db"
instructions = "Tables: customers, orders, products. Use select with a `where` object of column = value; raw SQL is turned off."

[[collections.tables]]
table = "customers"
columns = "id, name, city"

[[collections.tables]]
table = "orders"
columns = "id, customer_id, total, status, date"

[[collections.tables]]
table = "products"
columns = "id, name, price, stock"

