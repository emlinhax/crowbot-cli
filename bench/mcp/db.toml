[[tool]]
name = "list_tables"
description = "Every table with its columns."
schema = '{"type": "object", "properties": {}}'
read_only = true
act = "list"
collection = "tables"
render = "{table}: {columns}"

[[tool]]
name = "describe_table"
description = "A table's columns."
schema = '{"type": "object", "properties": {"table": {"type": "string"}}, "required": ["table"], "additionalProperties": false}'
read_only = true
act = "get"
collection = "tables"
key = "table"
render = "{table}: {columns}"
missing = "No table {table}."

[[tool]]
name = "select"
description = "Rows of a table whose columns equal every value in `where`, five at a time; pass `offset` for the next page."
schema = '{"type": "object", "properties": {"table": {"type": "string"}, "where": {"type": "object"}, "offset": {"type": "integer"}, "limit": {"type": "integer"}}, "required": ["table"], "additionalProperties": false}'
read_only = true
act = "list"
collection_arg = "table"
where_arg = "where"
page = { size = 5, arg = "offset", kind = "offset", limit = "limit" }
render = "{*}"

[[tool]]
name = "count"
description = "How many rows of a table have columns equal to every value in `where`."
schema = '{"type": "object", "properties": {"table": {"type": "string"}, "where": {"type": "object"}}, "required": ["table"], "additionalProperties": false}'
read_only = true
act = "count"
collection_arg = "table"
where_arg = "where"

[[tool]]
name = "insert"
description = "Add a row to a table; `row` holds its columns, the id is given."
schema = '{"type": "object", "properties": {"table": {"type": "string"}, "row": {"type": "object"}}, "required": ["table", "row"], "additionalProperties": false}'
act = "create"
collection_arg = "table"
merge_arg = "row"
text = "Inserted row {id} into {table}."

[[tool]]
name = "update"
description = "Change columns of the row with an id; `set` holds the columns and their new values."
schema = '{"type": "object", "properties": {"table": {"type": "string"}, "id": {"type": "integer"}, "set": {"type": "object"}}, "required": ["table", "id", "set"], "additionalProperties": false}'
act = "update"
collection_arg = "table"
key = "id"
merge_arg = "set"
text = "Updated {table} row {id}: {*}"
missing = "No row with id {id} in {table}."

[[tool]]
name = "run_sql"
description = "Run a raw SQL statement."
schema = '{"type": "object", "properties": {"query": {"type": "string"}}, "required": ["query"], "additionalProperties": false}'
act = "text"
text = "Raw SQL is turned off on this server; use select, count, insert or update."
