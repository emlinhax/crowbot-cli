# A simulated issue tracker, shaped like GitHub's MCP server: issues found by search and paged by
# cursor, a `state` enum, labels as a list that an update replaces whole, comments, and issues to
# create. The project is netlogd, the daemon the `re` server's binary is.
name = "tracker"
instructions = "Issues are numbered; `update_issue` replaces the labels it is given, so pass every label the issue should keep."

