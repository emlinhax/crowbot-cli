[[tool]]
name = "search_issues"
description = "Issues whose title or body contains the query, oldest first, three at a time. `state` keeps open or closed ones. Pass the cursor the last page gave for the next."
schema = '{"type": "object", "properties": {"query": {"type": "string"}, "state": {"type": "string", "enum": ["open", "closed"]}, "cursor": {"type": "string"}}, "additionalProperties": false}'
read_only = true
act = "list"
collection = "issues"
matches = { state = "state" }
filter = { arg = "query", fields = ["title", "body"] }
page = { size = 3, arg = "cursor", kind = "cursor" }
render = "#{number} [{state}] {title} (labels: {labels})"

[[tool]]
name = "get_issue"
description = "One issue with its body, labels, state and assignee."
schema = '{"type": "object", "properties": {"number": {"type": "integer"}}, "required": ["number"], "additionalProperties": false}'
read_only = true
act = "get"
collection = "issues"
key = "number"
render = "#{number} {title}\nState: {state}\nLabels: {labels}\nAssignee: {assignee}\n\n{body}"
missing = "No issue #{number}."

[[tool]]
name = "list_comments"
description = "The comments on an issue, oldest first."
schema = '{"type": "object", "properties": {"issue": {"type": "integer"}}, "required": ["issue"], "additionalProperties": false}'
read_only = true
act = "list"
collection = "comments"
matches = { issue = "issue" }
render = "comment {id} by {author}: {body}"

[[tool]]
name = "create_comment"
description = "Add a comment to an issue."
schema = '{"type": "object", "properties": {"issue": {"type": "integer"}, "body": {"type": "string"}}, "required": ["issue", "body"], "additionalProperties": false}'
act = "create"
collection = "comments"
set = { issue = "issue", body = "body" }
constants = { author = "crowbot" }
text = "Comment {id} added to #{issue}."

[[tool]]
name = "create_issue"
description = "Open a new issue."
schema = '{"type": "object", "properties": {"title": {"type": "string"}, "body": {"type": "string"}, "labels": {"type": "array", "items": {"type": "string"}}}, "required": ["title", "body"], "additionalProperties": false}'
act = "create"
collection = "issues"
id_field = "number"
set = { title = "title", body = "body", labels = "labels" }
constants = { state = "open", labels = [], assignee = "" }
text = "Opened issue #{number}: {title}."

[[tool]]
name = "update_issue"
description = "Change an issue's state, labels (the whole list) or assignee."
schema = '{"type": "object", "properties": {"number": {"type": "integer"}, "state": {"type": "string", "enum": ["open", "closed"]}, "labels": {"type": "array", "items": {"type": "string"}}, "assignee": {"type": "string"}}, "required": ["number"], "additionalProperties": false}'
act = "update"
collection = "issues"
key = "number"
set = { state = "state", labels = "labels", assignee = "assignee" }
text = "Issue #{number}: state {state}, labels [{labels}], assignee {assignee}."
missing = "No issue #{number}."

[[tool]]
name = "close_issue"
description = "Close an issue, giving why."
schema = '{"type": "object", "properties": {"number": {"type": "integer"}, "reason": {"type": "string", "enum": ["completed", "not_planned", "duplicate"]}}, "required": ["number", "reason"], "additionalProperties": false}'
act = "update"
collection = "issues"
key = "number"
set = { close_reason = "reason" }
constants = { state = "closed" }
text = "Closed #{number} as {reason}."
missing = "No issue #{number}."

[[tool]]
name = "assign_issue"
description = "Assign an issue to a user by login."
schema = '{"type": "object", "properties": {"number": {"type": "integer"}, "assignee": {"type": "string"}}, "required": ["number", "assignee"], "additionalProperties": false}'
act = "update"
collection = "issues"
key = "number"
set = { assignee = "assignee" }
text = "#{number} is assigned to {assignee}."
missing = "No issue #{number}."

[[tool]]
name = "list_labels"
description = "The labels issues can carry."
schema = '{"type": "object", "properties": {}}'
read_only = true
act = "list"
collection = "labels"
render = "{name}: {description}"

[[tool]]
name = "create_label"
description = "Add a label issues can carry."
schema = '{"type": "object", "properties": {"name": {"type": "string"}, "description": {"type": "string"}}, "required": ["name"], "additionalProperties": false}'
act = "create"
collection = "labels"
set = { name = "name", description = "description" }
text = "Label {name} created."

[[tool]]
name = "list_users"
description = "People who can be assigned issues."
schema = '{"type": "object", "properties": {}}'
read_only = true
act = "list"
collection = "users"
render = "{login} ({name})"

[[tool]]
name = "get_issue_timeline"
description = "What happened to an issue over time."
schema = '{"type": "object", "properties": {"number": {"type": "integer"}}, "required": ["number"], "additionalProperties": false}'
read_only = true
act = "text"
text = "#{number}: opened, labelled, discussed; nothing else recorded."
