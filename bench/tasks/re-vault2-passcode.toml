prompt = "Reverse the ./vault2 binary in this folder and find the passcode it accepts. Report the exact passcode."
repo = "crackme"
mode = "auto"
turns = 40
suite = "re"
# vault2's check is a two-round, chained transform; the passcode is not in the binary, so the reply
# holds it only if the run reversed the chain and recovered it.
check = "grep -qF 'q7Z-m2L+p9X=r4Kt' {reply}"
