prompt = "The open issue in the tracker (MCP server) about exporting logs to CSV duplicates issue #12. Comment `Duplicate of #12` on it, then close it as a duplicate."
repo = "desk"
mode = "auto"
turns = 25
suite = "mcp"
mcp = ["tracker"]
check = "python3 {checks}/mcp_state.py .mcp/tracker.json 'comments[issue=23].body' '~' 'duplicate of #12' && python3 {checks}/mcp_state.py .mcp/tracker.json 'issues[number=23].state' == closed"
