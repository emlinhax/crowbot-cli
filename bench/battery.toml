# One battery run: the model, how often each task runs, and what stops it. `make battery` reads
# this; the shipped binary never does.
model = "glm-5.3-flash-crow"
repeats = 3
# The smoke account's plan runs 2 requests in flight; a third run fails on 429 once crowbot's
# retries run out (2026-10-14: 84 of 90 runs at 4). Raise it only with a bigger plan.
parallel = 2

[cap_micros]
value = 60000000
reason = "the most one full run may spend; 90 runs are estimated at about $8"

[run_cap_micros]
value = 2000000
reason = "a task costs about $0.09; twenty times that is a runaway, not a hard task"

[run_wall_secs]
value = 900
reason = "a slow task takes a few minutes; fifteen means a command or the stream is stuck"

[stop_grace_secs]
value = 10
reason = "time for crowbot to end its commands after Ctrl-C before it is killed"

[check_secs]
value = 600
reason = "a task's check is its repo's test suite; a cold Rust build of one is a few minutes"
