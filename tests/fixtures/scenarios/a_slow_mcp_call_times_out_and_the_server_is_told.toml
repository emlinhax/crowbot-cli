description = "A call past the server's `timeout_secs` fails, and the server hears it was cancelled"
args = ["--mode", "auto", "-p", "wait for it"]
home_files = { "config.toml" = "[mcp.fake]\ncommand = '{fake_mcp}'\nargs = ['--log', 'heard.txt']\ntimeout_secs = 1\n" }

[[reply]]
calls = [{ name = "fake__slow", arguments = '{}' }]

[[reply]]
text = "It never answered."

[expect]
exit = 0
stdout = "It never answered.\n"
files = { "heard.txt" = "initialize\nnotifications/initialized\ntools/list\ntools/call slow\nnotifications/cancelled 3\n" }

[[expect.requests]]
index = 1
message = -1
role = "tool"
contains = "MCP server fake: it did not answer within 1s."
