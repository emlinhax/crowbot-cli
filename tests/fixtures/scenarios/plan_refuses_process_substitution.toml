description = "PLAN refuses a command hidden in process substitution behind an allowed `cat`"
args = ["--mode", "plan", "-p", "look around"]
project = "calc"

[[reply]]
calls = [{ name = "bash", arguments = '{"command": "cat <(sed -i s/5/4/ src/calc.txt)"}' }]

[[reply]]
text = 'The plan is ready.'

[expect]
exit = 0
files = { "src/calc.txt" = "2 + 2 = 5\n" }

[[expect.requests]]
index = 1
message = -1
role = "tool"
contains = "Not allowed"
