description = "MANUAL asks before an MCP tool runs; a headless run cannot answer, so the call is declined"
args = ["-p", "echo something"]
home_files = { "config.toml" = "[mcp.fake]\ncommand = '{fake_mcp}'\n" }

[[reply]]
calls = [{ name = "fake__echo", arguments = '{"text": "should not arrive"}' }]

[[reply]]
text = "I could not call it."

[expect]
exit = 0
stderr_contains = ["needs permission"]

[[expect.requests]]
index = 1
message = -1
role = "tool"
contains = "nobody can answer"
