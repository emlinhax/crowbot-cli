description = "webfetch through the real cffetch client: a readable page reaches the model as markdown"
args = ["--mode", "auto", "-p", "read the docs"]
replies = ["web/fetch_ok.sse", "web/done.sse"]

[expect]
exit = 0
stdout_contains = ["Done."]
hits = { "/web/ok" = 1 }

[[expect.requests]]
index = 1
message = -1
role = "tool"
contains = "# Widget API"

[[expect.requests]]
index = 1
message = -1
role = "tool"
contains = "The widget spins at 3 rpm."
