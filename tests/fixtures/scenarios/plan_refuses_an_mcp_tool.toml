description = "PLAN refuses an MCP server's tool, which may change anything, even where a rule allows it"
args = ["--mode", "plan", "-p", "look around"]
home_files = { "config.toml" = "[mcp.fake]\ncommand = '{fake_mcp}'\n\n[[permission]]\npermission = 'mcp'\npattern = 'fake__*'\naction = 'allow'\n" }

[[reply]]
calls = [{ name = "fake__echo", arguments = '{"text": "should not arrive"}' }]

[[reply]]
text = "The plan is ready."

[expect]
exit = 0
stderr_contains = ["mcp_write fake__echo"]

[[expect.requests]]
index = 1
message = -1
role = "tool"
contains = "Not allowed"

[[expect.requests]]
index = 1
message = -1
role = "tool"
lacks = "should not arrive"
