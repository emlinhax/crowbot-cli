description = "A command the model runs does not inherit crowbot's key from the environment"
args = ["--mode", "auto", "-p", "print the key"]

[[reply]]
calls = [{ name = "bash", arguments = '{"command": "echo key=${CROWBOT_API_KEY-none}"}' }]

[[reply]]
text = 'No key in sight.'

[expect]
exit = 0

[[expect.requests]]
index = 1
message = -1
role = "tool"
contains = "key=none"
lacks = "test-key"
